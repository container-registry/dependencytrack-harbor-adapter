# Configuration for typos spell checker
# https://github.com/crate-ci/typos
#
# Scope: markdown files (full content) and YAML files (comments only).
# Go comments are checked by misspell via golangci-lint (.golangci.yaml).
# The hygiene workflow extracts YAML comment lines into temp files
# before running typos.

[default]
extend-ignore-identifiers-re = [
    # Hex strings and base64 blobs
    "[A-Za-z0-9+/]{20,}",
]

# typos honors extend-ignore-re only under [default]; a [type.md] copy is silently
# dropped, which is how `bbfd0ba` (a git short hash) got read as a misspelled `ba`.
extend-ignore-re = [
    # URLs
    "https?://[^\\s]+",
    # Fenced code blocks
    "```[\\s\\S]*?```",
    # Inline code, including git short hashes and image digests
    "`[^`]+`",
]

[default.extend-words]
# Container/OCI terminology
oci  = "oci"
oras = "oras"
# Common Go abbreviations referenced in docs
cfg  = "cfg"
ctx  = "ctx"

[files]
extend-exclude = [
    # Dependency checksums
    "go.sum",

    # Claude Code agent/plan files (not shipped)
    ".claude/",

    # Build artifacts
    "vendor/",
    "bin/",
    "dist/",
]

